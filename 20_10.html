<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>20/10 Phiêu Du & Thơ Mộng</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            /* Bầu trời đêm mộng mơ pha sắc tím hồng pastel */
            background: radial-gradient(circle at 50% 30%, #30103b 0%, #160322 55%, #080010 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: #fff;
            position: fixed;
        }

        #canvas-box {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        #touch-layer {
            position: absolute;
            inset: 0;
            z-index: 50;
            touch-action: manipulation;
        }

        /* Vầng hào quang sương mai êm dịu */
        .ethereal-glow {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 5;
            background: radial-gradient(circle at 50% 40%, rgba(255, 182, 193, 0.12) 0%, rgba(186, 104, 200, 0.15) 60%, rgba(10, 0, 20, 0.4) 100%);
        }

        #flash {
            position: absolute;
            inset: 0;
            background: #fff;
            opacity: 0;
            pointer-events: none;
            z-index: 60;
            transition: opacity 0.5s ease-out;
        }

        .bar-top, .bar-bottom {
            position: absolute;
            left: 0;
            width: 100%;
            height: 4.5vh;
            background: linear-gradient(180deg, rgba(20, 2, 30, 0.6), transparent);
            z-index: 10;
            pointer-events: none;
        }
        .bar-bottom {
            bottom: 0;
            background: linear-gradient(0deg, rgba(20, 2, 30, 0.6), transparent);
        }

        #header-bar {
            position: absolute;
            top: 5.5vh;
            left: 50%;
            transform: translateX(-50%);
            z-index: 25;
            text-align: center;
            pointer-events: none;
            width: 80%;
        }
        #scene-txt {
            font-size: 0.8rem;
            letter-spacing: 4px;
            font-weight: 600;
            background: linear-gradient(90deg, #ff9a9e, #fecfef, #a1c4fd, #c2e9fb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
            text-shadow: 0 0 10px rgba(255, 182, 193, 0.5);
        }
        #bar-bg {
            width: 140px;
            height: 3px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
            overflow: hidden;
            margin: 0 auto;
        }
        #bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ff9a9e, #fad0c4, #fbc2eb);
            transition: width 0.6s ease;
        }

        /* Hộp phụ đề màng sương thủy tinh siêu tinh tế */
        #ui-box {
            position: absolute;
            bottom: 6.5vh;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            width: 92%;
            max-width: 540px;
            pointer-events: none;
            background: rgba(35, 10, 48, 0.72);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 200, 220, 0.4);
            border-radius: 22px;
            padding: 18px 24px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.45), inset 0 0 20px rgba(255, 192, 203, 0.2);
            text-align: center;
            min-height: 95px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        #title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 6px;
            background: linear-gradient(90deg, #ffffff, #ffe3ec, #e0c3fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1.5px;
            text-shadow: 0 0 15px rgba(255, 182, 193, 0.6);
        }

        #desc {
            font-size: 0.98rem;
            line-height: 1.65;
            color: #fbf5fc;
            min-height: 44px;
            font-style: italic;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
        }

        .cursor {
            display: inline-block;
            width: 2px;
            height: 1rem;
            background-color: #ffb6c1;
            vertical-align: middle;
            margin-left: 3px;
            animation: blink 0.8s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 0; }
            50% { opacity: 1; }
        }

        #movie-status {
            position: absolute;
            bottom: 1.8vh;
            left: 50%;
            transform: translateX(-50%);
            z-index: 25;
            font-size: 0.7rem;
            letter-spacing: 2.5px;
            color: rgba(255, 240, 250, 0.75);
            text-transform: uppercase;
            pointer-events: none;
        }

        /* Màn hình mở đầu lãng mạn */
        #welcome {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, #42114d, #10001a);
            z-index: 80;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            text-align: center;
            padding: 20px;
            transition: opacity 0.8s ease;
        }
        #welcome h1 {
            font-size: 2.5rem;
            letter-spacing: 6px;
            background: linear-gradient(135deg, #ffffff 20%, #ffc2d1 50%, #e0aaff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
            text-shadow: 0 0 30px rgba(255, 182, 193, 0.7);
        }
        #welcome p {
            font-size: 0.88rem;
            letter-spacing: 3px;
            color: #fbeaf5;
            animation: pulseHint 1.6s infinite;
        }
        @keyframes pulseHint {
            0%, 100% { opacity: 0.4; transform: scale(0.98); }
            50% { opacity: 1; transform: scale(1.02); }
        }
    </style>
</head>
<body>

    <div id="touch-layer"></div>
    <div class="bar-top"></div>
    <div class="bar-bottom"></div>
    <div class="ethereal-glow"></div>
    <div id="flash"></div>

    <div id="header-bar">
        <div id="scene-txt">GIẤC MƠ BỒNG BỀNH</div>
        <div id="bar-bg"><div id="bar-fill"></div></div>
    </div>

    <div id="welcome">
        <h1>20 · 10</h1>
        <p>✦ CHẠM MÀN HÌNH ĐỂ THƯỞNG THỨC ✦</p>
    </div>

    <div id="ui-box">
        <h2 id="title">...</h2>
        <div id="desc"><span id="text-content"></span><span class="cursor"></span></div>
    </div>

    <div id="movie-status">✦ ĐANG TỰ ĐỘNG CHIẾU PHIM ✦</div>

    <div id="canvas-box"></div>

    <!-- Nhạc nền anhtheday -->
    <audio id="audio" loop preload="auto" playsinline webkit-playsinline>
        <source src="anhtheday.mp3" type="audio/mpeg">
        <source src="anhtheday" type="audio/mpeg">
    </audio>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>

    <script>
        const container = document.getElementById('canvas-box');

        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x160322, 0.015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 18, 30);
        let lookTarget = new THREE.Vector3(0, 2, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "low-power" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
        container.appendChild(renderer.domElement);

        // ================= TẠO TEXTURE CÁNH HOA LỤA & BƯỚM DẠ QUANG =================
        // 1. Cánh hoa lụa mềm mượt mờ ảo (Silk Petal)
        function createSilkPetalTex() {
            const cv = document.createElement('canvas');
            cv.width = 64; cv.height = 64;
            const ctx = cv.getContext('2d');
            const g = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            g.addColorStop(0, 'rgba(255, 230, 240, 0.95)');
            g.addColorStop(0.4, 'rgba(255, 130, 180, 0.7)');
            g.addColorStop(0.8, 'rgba(230, 120, 230, 0.2)');
            g.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = g;
            ctx.beginPath();
            ctx.ellipse(32, 32, 28, 16, Math.PI / 4, 0, Math.PI * 2);
            ctx.fill();
            return new THREE.CanvasTexture(cv);
        }
        const silkPetalTex = createSilkPetalTex();

        // 2. Bướm dạ quang phát sáng (Luminous Butterfly)
        function createButterflyTex() {
            const cv = document.createElement('canvas');
            cv.width = 64; cv.height = 64;
            const ctx = cv.getContext('2d');
            ctx.translate(32, 32);
            ctx.fillStyle = 'rgba(240, 210, 255, 0.9)';
            ctx.shadowColor = '#00f2fe';
            ctx.shadowBlur = 10;
            // Cánh trên
            ctx.beginPath();
            ctx.ellipse(-14, -10, 16, 9, Math.PI / 4, 0, Math.PI * 2);
            ctx.ellipse(14, -10, 16, 9, -Math.PI / 4, 0, Math.PI * 2);
            ctx.fill();
            // Cánh dưới
            ctx.fillStyle = 'rgba(255, 140, 200, 0.85)';
            ctx.beginPath();
            ctx.ellipse(-10, 10, 12, 7, -Math.PI / 6, 0, Math.PI * 2);
            ctx.ellipse(10, 10, 12, 7, Math.PI / 6, 0, Math.PI * 2);
            ctx.fill();
            return new THREE.CanvasTexture(cv);
        }
        const butterflyTex = createButterflyTex();

        // 3. Đom đóm & Bụi sao tinh tú (Firefly Star)
        function createFireflyTex() {
            const cv = document.createElement('canvas');
            cv.width = 32; cv.height = 32;
            const ctx = cv.getContext('2d');
            const g = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
            g.addColorStop(0, 'rgba(255, 255, 255, 1)');
            g.addColorStop(0.35, 'rgba(255, 230, 130, 0.9)');
            g.addColorStop(0.7, 'rgba(255, 170, 220, 0.4)');
            g.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, 32, 32);
            return new THREE.CanvasTexture(cv);
        }
        const fireflyTex = createFireflyTex();

        // ================= TẦNG 1: MƯA CÁNH HOA LỤA BAY LƠ LỬNG TRONG GIÓ =================
        const petalCount = 180;
        const petalGeo = new THREE.BufferGeometry();
        const petalPos = new Float32Array(petalCount * 3);
        const petalSpeeds = [];

        for (let i = 0; i < petalCount; i++) {
            petalPos[i * 3] = (Math.random() - 0.5) * 45;
            petalPos[i * 3 + 1] = (Math.random() - 0.5) * 40;
            petalPos[i * 3 + 2] = (Math.random() - 0.5) * 45;
            petalSpeeds.push({
                y: 0.035 + Math.random() * 0.04,
                angle: Math.random() * Math.PI * 2,
                freq: 0.02 + Math.random() * 0.03
            });
        }
        petalGeo.setAttribute('position', new THREE.BufferAttribute(petalPos, 3));
        const petalMesh = new THREE.Points(petalGeo, new THREE.PointsMaterial({
            size: 1.4, map: silkPetalTex, transparent: true, blending: THREE.AdditiveBlending, opacity: 0.85
        }));
        scene.add(petalMesh);

        // ================= TẦNG 2: BẦY BƯỚM DẠ QUANG VỖ CÁNH UỐN LƯỢN (Butterflies) =================
        const butterflyGroup = new THREE.Group();
        const butterflies = [];
        for (let i = 0; i < 24; i++) {
            const mat = new THREE.SpriteMaterial({ map: butterflyTex, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending });
            const sp = new THREE.Sprite(mat);
            const r = 8 + Math.random() * 14;
            const th = Math.random() * Math.PI * 2;
            sp.position.set(Math.cos(th) * r, (Math.random() - 0.5) * 12 + 4, Math.sin(th) * r);
            sp.scale.set(1.6, 1.6, 1);
            sp.userData = {
                radius: r,
                speed: 0.015 + Math.random() * 0.02,
                angle: th,
                yOff: sp.position.y,
                flapSpeed: 4 + Math.random() * 4
            };
            butterflyGroup.add(sp);
            butterflies.push(sp);
        }
        scene.add(butterflyGroup);

        // ================= TẦNG 3: BỤI SAO & ĐOM ĐÓM LẤP LÁNH (Fireflies) =================
        const fireflyCount = 280;
        const fireflyGeo = new THREE.BufferGeometry();
        const fireflyPos = new Float32Array(fireflyCount * 3);
        for (let i = 0; i < fireflyCount * 3; i += 3) {
            fireflyPos[i] = (Math.random() - 0.5) * 60;
            fireflyPos[i + 1] = (Math.random() - 0.5) * 45;
            fireflyPos[i + 2] = (Math.random() - 0.5) * 60;
        }
        fireflyGeo.setAttribute('position', new THREE.BufferAttribute(fireflyPos, 3));
        const fireflyMesh = new THREE.Points(fireflyGeo, new THREE.PointsMaterial({
            size: 0.5, map: fireflyTex, transparent: true, blending: THREE.AdditiveBlending, opacity: 0.75
        }));
        scene.add(fireflyMesh);

        // ================= CẢNH 1: DẢI LỤA HOA NGÂN HÀ KHỞI NGUYÊN (Cosmic Silk Petal Ribbon) =================
        const gRoseGarden = new THREE.Group();
        const ribbonCount = 2400;
        const ribbonGeo = new THREE.BufferGeometry();
        const ribbonPos = new Float32Array(ribbonCount * 3);
        for (let i = 0; i < ribbonCount; i++) {
            const u = i / ribbonCount;
            const t = u * Math.PI * 10;
            const r = 3 + u * 10;
            ribbonPos[i * 3] = Math.cos(t) * r + Math.sin(u * 20) * 0.5;
            ribbonPos[i * 3 + 1] = Math.sin(t * 0.8) * 3 + (u * 10 - 2);
            ribbonPos[i * 3 + 2] = Math.sin(t) * r + Math.cos(u * 20) * 0.5;
        }
        ribbonGeo.setAttribute('position', new THREE.BufferAttribute(ribbonPos, 3));
        const ribbonMesh = new THREE.Points(ribbonGeo, new THREE.PointsMaterial({
            size: 0.85, map: silkPetalTex, transparent: true, blending: THREE.AdditiveBlending, opacity: 1
        }));
        gRoseGarden.add(ribbonMesh);
        scene.add(gRoseGarden);

        // ================= CẢNH 2: TRÁI TIM PHA LÊ LƠ LỬNG (Floating Crystal Heart) =================
        const gHeart = new THREE.Group();
        const heartCount = 3000;
        const heartGeo = new THREE.BufferGeometry();
        const heartPos = new Float32Array(heartCount * 3);
        for (let i = 0; i < heartCount; i++) {
            const t = Math.PI * 2 * Math.random();
            let x = 16 * Math.pow(Math.sin(t), 3);
            let y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
            let z = (Math.random() - 0.5) * 5;
            heartPos[i * 3] = x * 0.32;
            heartPos[i * 3 + 1] = y * 0.32 + 2.5;
            heartPos[i * 3 + 2] = z * 0.32;
        }
        heartGeo.setAttribute('position', new THREE.BufferAttribute(heartPos, 3));
        const heartMesh = new THREE.Points(heartGeo, new THREE.PointsMaterial({
            size: 0.75, map: fireflyTex, transparent: true, blending: THREE.AdditiveBlending, opacity: 0
        }));
        gHeart.add(heartMesh);
        scene.add(gHeart);

        // ================= CẢNH 3: BẦU TRỜI BONG BÓNG XÀ CỪ LƠ LỬNG (Iridescent Dream Orbs) =================
        const gTornado = new THREE.Group();
        for (let i = 0; i < 35; i++) {
            const orbGeo = new THREE.SphereGeometry(0.8 + Math.random() * 0.9, 16, 16);
            const orbMat = new THREE.MeshBasicMaterial({
                color: (i % 2 === 0 ? 0xffb6c1 : 0xb0e0e6),
                wireframe: true,
                transparent: true,
                opacity: 0
            });
            const orb = new THREE.Mesh(orbGeo, orbMat);
            orb.position.set(
                (Math.random() - 0.5) * 26,
                (Math.random() - 0.5) * 16 + 2,
                (Math.random() - 0.5) * 26
            );
            orb.userData = { y0: orb.position.y, s: Math.random() * 5 };
            gTornado.add(orb);
        }
        scene.add(gTornado);

        // ================= CẢNH 4: BIỂN SƯƠNG MÙ CỰC QUANG SÓNG LƯỢN (Aurora Silk Sea) =================
        const gField = new THREE.Group();
        const sCols = 40, sRows = 40;
        const seaGeo = new THREE.BufferGeometry();
        const seaPos = new Float32Array(sCols * sRows * 3);
        let ptr = 0;
        for (let i = 0; i < sCols; i++) {
            for (let j = 0; j < sRows; j++) {
                seaPos[ptr] = (i / sCols - 0.5) * 55;
                seaPos[ptr + 1] = -4;
                seaPos[ptr + 2] = (j / sRows - 0.5) * 55;
                ptr += 3;
            }
        }
        seaGeo.setAttribute('position', new THREE.BufferAttribute(seaPos, 3));
        const seaMesh = new THREE.Points(seaGeo, new THREE.PointsMaterial({
            size: 0.8, map: silkPetalTex, transparent: true, blending: THREE.AdditiveBlending, opacity: 0
        }));
        gField.add(seaMesh);
        scene.add(gField);

        // ================= CẢNH 5: THIỆP CHÚC MỪNG 20/10 PHA LÊ VÀNG HỒNG =================
        const gFinale = new THREE.Group();
        function getDreamCardTexture() {
            const cv = document.createElement('canvas');
            cv.width = 512; cv.height = 360;
            const ctx = cv.getContext('2d');
            const gr = ctx.createLinearGradient(0, 0, 512, 360);
            gr.addColorStop(0, "rgba(55, 15, 65, 0.94)");
            gr.addColorStop(1, "rgba(25, 5, 40, 0.94)");
            ctx.fillStyle = gr;
            ctx.fillRect(0, 0, 512, 360);
            ctx.strokeStyle = "rgba(255, 182, 193, 0.85)";
            ctx.lineWidth = 3;
            ctx.strokeRect(8, 8, 496, 344);

            ctx.font = "bold 26px sans-serif"; ctx.fillStyle = "#ffc2d1"; ctx.textAlign = "center";
            ctx.fillText("HAPPY WOMEN'S DAY", 256, 70);

            ctx.font = "bold 24px sans-serif"; ctx.fillStyle = "#ffffff";
            ctx.fillText("20 · 10 YÊU THƯƠNG", 256, 125);

            ctx.font = "18px sans-serif"; ctx.fillStyle = "#ffeaf2";
            ctx.fillText("Chúc một nửa thế giới luôn nhẹ nhàng, rạng rỡ,", 256, 190);
            ctx.fillText("mỗi ngày đều phiêu du trong bình yên và hạnh phúc,", 256, 230);
            ctx.fillText("và luôn được yêu thương trọn vẹn nhất!", 256, 270);

            ctx.font = "italic 18px sans-serif"; ctx.fillStyle = "#ffb6c1";
            ctx.fillText("— Món Quà Dịu Dàng Gửi Đến Bạn 🌸 —", 256, 325);
            return new THREE.CanvasTexture(cv);
        }
        const cardMesh = new THREE.Mesh(
            new THREE.PlaneGeometry(12, 8.5),
            new THREE.MeshBasicMaterial({ map: getDreamCardTexture(), transparent: true, opacity: 0 })
        );
        cardMesh.position.y = 1;
        gFinale.add(cardMesh);
        scene.add(gFinale);

        // KỊCH BẢN 5 CẢNH PHIM THƠ MỘNG
        const movieScenes = [
            { t: "Phiêu Du Miền Cổ Tích", d: "Mỗi người phụ nữ là một giai điệu dịu êm, nhẹ nhàng điểm tô cho cuộc đời muôn vạn sắc màu.", pos: { x: 0, y: 16, z: 26 }, grp: gRoseGarden },
            { t: "Trái Tim Ngập Tràn Yêu Thương", d: "Cảm ơn vì đã luôn mang đến sự ấm áp, bao dung và nét ngọt ngào xoa dịu những nhọc nhằn.", pos: { x: 0, y: 12, z: 22 }, grp: gHeart },
            { t: "Giấc Mơ Bồng Bềnh", d: "Chúc bạn luôn giữ trọn tâm hồn trong trẻo, tự do phiêu du và tỏa sáng theo cách riêng biệt của mình.", pos: { x: 14, y: 14, z: 24 }, grp: gTornado },
            { t: "Bình Yên Trước Gió", d: "Giữa những tất bật đời thường, chúc bạn luôn tìm thấy góc bình yên, dịu dàng như làn sương sớm.", pos: { x: 0, y: 6, z: 22 }, grp: gField },
            { t: "Chúc Mừng Ngày 20/10!", d: "Chúc toàn thể phái đẹp có một ngày 20/10 thật ngọt ngào, nhận được ngàn yêu thương chân thành nhất ❤️", pos: { x: 0, y: 1, z: 14 }, grp: gFinale }
        ];

        const allGroups = [gRoseGarden, gHeart, gTornado, gField, gFinale];
        function fadeGroup(grp, target) {
            grp.traverse(c => {
                if (c.material) new TWEEN.Tween(c.material).to({ opacity: target }, 700).start();
            });
        }

        // ================= HIỆU ỨNG GÕ CHỮ TỪNG TỪ =================
        let typeTimer = null;
        const textContentEl = document.getElementById('text-content');
        function typeWriter(text, speed = 35) {
            clearInterval(typeTimer);
            textContentEl.innerText = "";
            let i = 0;
            typeTimer = setInterval(() => {
                if (i < text.length) {
                    textContentEl.innerText += text.charAt(i);
                    i++;
                } else {
                    clearInterval(typeTimer);
                }
            }, speed);
        }

        let curIdx = 0;
        let isStarted = false;
        let autoPlayTimer = null;

        const audio = document.getElementById('audio');
        const touchLayer = document.getElementById('touch-layer');
        const welcome = document.getElementById('welcome');
        const flash = document.getElementById('flash');
        const sceneTxt = document.getElementById('scene-txt');
        const barFill = document.getElementById('bar-fill');
        const titleEl = document.getElementById('title');

        function playScene(idx) {
            const sc = movieScenes[idx];
            sceneTxt.innerText = `CẢNH 0${idx + 1} / 05`;
            barFill.style.width = `${((idx + 1) / movieScenes.length) * 100}%`;

            flash.style.opacity = '0.35';
            setTimeout(() => { flash.style.opacity = '0'; }, 300);

            allGroups.forEach(g => {
                if (g === sc.grp) fadeGroup(g, 1);
                else fadeGroup(g, 0);
            });

            new TWEEN.Tween(camera.position).to(sc.pos, 1800).easing(TWEEN.Easing.Cubic.InOut).start();

            titleEl.style.opacity = '0';
            setTimeout(() => {
                titleEl.innerText = sc.t;
                titleEl.style.opacity = '1';
                typeWriter(sc.d, 35);
            }, 300);
        }

        function nextAutoScene() {
            curIdx = (curIdx + 1) % movieScenes.length;
            playScene(curIdx);
        }

        function startMovie() {
            if (isStarted) return;
            isStarted = true;

            if (audio.paused) {
                audio.play().catch(() => {});
            }

            welcome.style.opacity = '0';
            setTimeout(() => welcome.remove(), 700);

            playScene(0);
            autoPlayTimer = setInterval(nextAutoScene, 7500);
        }

        touchLayer.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            if (!isStarted) {
                startMovie();
            } else {
                clearInterval(autoPlayTimer);
                nextAutoScene();
                autoPlayTimer = setInterval(nextAutoScene, 7500);
            }
        });

        // ================= VÒNG LẶP RENDER HOẠT ẢNH BỒNG BỀNH =================
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            TWEEN.update();
            const time = clock.getElapsedTime();
            camera.lookAt(lookTarget);

            // 1. Cánh hoa lụa bay phiêu du, đong đưa chao lượn tự nhiên
            const pP = petalGeo.attributes.position;
            for (let i = 0; i < petalCount; i++) {
                const sp = petalSpeeds[i];
                let y = pP.getY(i) - sp.y;
                let x = pP.getX(i) + Math.sin(time * 1.5 + sp.angle) * 0.035;
                let z = pP.getZ(i) + Math.cos(time * 1.2 + sp.angle) * 0.02;
                if (y < -20) {
                    y = 20;
                    x = (Math.random() - 0.5) * 45;
                }
                pP.setY(i, y);
                pP.setX(i, x);
                pP.setZ(i, z);
            }
            petalGeo.attributes.position.needsUpdate = true;
            petalMesh.rotation.y = time * 0.025;

            // 2. Bầy bướm dạ quang bay uốn lượn và dập dìu cánh
            butterflies.forEach(b => {
                const ud = b.userData;
                ud.angle += ud.speed;
                b.position.x = Math.cos(ud.angle) * ud.radius;
                b.position.z = Math.sin(ud.angle) * ud.radius;
                b.position.y = ud.yOff + Math.sin(time * 2 + ud.radius) * 1.5;
                // Vỗ cánh nhịp nhàng
                const flap = 1.3 + Math.sin(time * ud.flapSpeed) * 0.35;
                b.scale.set(flap, flap, 1);
            });

            // 3. Đom đóm nhấp nháy bồng bềnh
            fireflyMesh.material.opacity = 0.55 + Math.sin(time * 2.5) * 0.25;
            fireflyMesh.rotation.y = -time * 0.015;

            // 4. Cảnh 1: Dải lụa ngân hà hoa xoay chậm rãi
            if (ribbonMesh.material.opacity > 0.05) {
                gRoseGarden.rotation.y = time * 0.08;
            }

            // 5. Cảnh 2: Trái tim pha lê đập nhịp đập êm dịu
            if (heartMesh.material.opacity > 0.05) {
                const bt = 1 + Math.sin(time * 2.2) * 0.05;
                gHeart.scale.set(bt, bt, bt);
            }

            // 6. Cảnh 3: Bong bóng xà cừ nhấp nhô lơ lửng
            if (gTornado.children[0].material.opacity > 0.05) {
                gTornado.children.forEach(orb => {
                    orb.position.y = orb.userData.y0 + Math.sin(time * 1.8 + orb.userData.s) * 0.6;
                    orb.rotation.y = time * 0.2;
                });
            }

            // 7. Cảnh 4: Cánh biển sương mù cực quang dập dềnh
            if (seaMesh.material.opacity > 0.05) {
                const sPos = seaGeo.attributes.position;
                let ptr = 0;
                for (let i = 0; i < sCols; i++) {
                    for (let j = 0; j < sRows; j++) {
                        const wave = Math.sin(i * 0.25 + time * 1.6) * Math.cos(j * 0.25 + time * 1.6) * 1.2;
                        sPos.setY(ptr / 3, -4 + wave);
                        ptr += 3;
                    }
                }
                seaGeo.attributes.position.needsUpdate = true;
            }

            // 8. Cảnh 5: Thiệp bay lơ lửng
            if (cardMesh.material.opacity > 0.05) {
                cardMesh.position.y = 1 + Math.sin(time * 1.5) * 0.25;
            }

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
